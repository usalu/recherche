<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akteursnetz · Bildprüfung</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#13252b;background:#f5f0df;--logo-opacity:1}*{box-sizing:border-box}
body{margin:0}.top{position:sticky;top:0;z-index:4;background:#001d25;color:white;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;margin:0}.progress{font-weight:700}.bar{width:220px;height:10px;background:#365158;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#ffcc32}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}.opacity-control{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:13px}.opacity-control input{width:120px;padding:0;accent-color:#ffcc32}.opacity-control output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}input,select,button,textarea{font:inherit;border:1px solid #8a9695;border-radius:5px;padding:8px;background:white}button{cursor:pointer}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 72px)}.list{border-right:1px solid #bbb;background:#eee8d7;overflow:auto;height:calc(100vh - 72px)}
.row{padding:9px 12px;border-bottom:1px solid #d0c9b9;cursor:pointer}.row:hover,.row.active{background:#fff}.row .key{font-weight:700}.row small{display:block;color:#526268}.row.confirmed .key:after{content:' ✓';color:#087c4b}.row.none .key:after{content:' ✓ none';color:#7a5210}
.main{padding:22px;max-width:1200px}.headline{display:flex;gap:15px;align-items:flex-start;justify-content:space-between}.headline h2{margin:0 0 5px}.meta{color:#536168}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e3ddca;font-size:12px;margin-right:5px}
.suggestion{margin:16px 0;padding:12px;border-left:5px solid #ffbd00;background:#fff8d7}.source{margin:10px 0}.source a{color:#006e87}.candidates{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin:14px 0}
.candidate{background:white;border:3px solid transparent;border-radius:8px;padding:8px;min-height:195px;text-align:center;cursor:pointer;position:relative}.candidate:hover{border-color:#94a4a6}.candidate.selected{border-color:#007d92}.candidate.suggested:before{content:'Vorschlag';position:absolute;top:5px;left:5px;background:#ffcc32;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:700}.candidate.rejected{cursor:not-allowed;opacity:.55}.candidate.rejected:hover{border-color:#a86b6b}.candidate img{width:130px;height:130px;object-fit:contain;background:white}.candidate b,.candidate small{display:block}.candidate small{color:#617075}.candidate .rejection{color:#8b1d1d;font-weight:700;margin-top:5px}
.previews{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0}.theme{padding:14px;border-radius:8px;text-align:center}.theme.light{background:#f7f3e3}.theme.dark{background:#001d25;color:white}.node{width:128px;height:128px;border-radius:50%;overflow:hidden;position:relative;border:3px solid currentColor;background:#d8d2c0}.dark .node{background:#344b50}.node img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:var(--logo-opacity)}.node strong{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;text-shadow:0 0 2px white;color:#001117}.dark .node strong{color:white;text-shadow:0 0 2px #001117}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px}.logo{background:#007d92;color:white;border-color:#007d92}.none{background:#785d18;color:white;border-color:#785d18}.next{margin-left:auto}.message{font-weight:700}.error{color:#a40000}
textarea{width:100%;min-height:65px;margin-top:10px}@media(max-width:780px){.layout{grid-template-columns:1fr}.list{height:220px;border-right:0;border-bottom:1px solid #bbb}.main{padding:14px}.tools{margin-left:0}}
</style>
</head>
<body>
<header class="top"><h1>Akteursnetz · Bildprüfung</h1><span class="progress" id="progress">0 / 762</span><span class="bar"><i id="bar"></i></span>
<div class="tools"><label class="opacity-control" for="logoOpacity">Logo-Deckkraft <input id="logoOpacity" type="range" min="0" max="100" step="5" value="100"><output id="logoOpacityValue" for="logoOpacity">100 %</output></label><input id="search" placeholder="Name oder ID"><select id="country"><option value="">Alle Länder</option></select><select id="status"><option value="open">Offen</option><option value="">Alle</option><option value="confirmed">Bestätigt</option><option value="none">Nur none</option></select></div></header>
<div class="layout"><aside class="list" id="list"></aside><main class="main" id="main"><p>Lade Daten …</p></main></div>
<script>
let state={nodes:[]},filtered=[],current=null,selected=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=s=>encodeURIComponent(s??'');
function setLogoOpacity(value){const percent=Math.max(0,Math.min(100,Number(value)||0));$('logoOpacity').value=percent;$('logoOpacityValue').textContent=`${percent} %`;document.documentElement.style.setProperty('--logo-opacity',percent/100);try{localStorage.setItem('akteursnetz.logoOpacity',percent)}catch{}}
let initialLogoOpacity=100;try{const saved=localStorage.getItem('akteursnetz.logoOpacity');if(saved!==null)initialLogoOpacity=saved}catch{}setLogoOpacity(initialLogoOpacity);$('logoOpacity').addEventListener('input',e=>setLogoOpacity(e.target.value));
async function load(){state=await (await fetch('/api/state')).json();for(const cc of [...new Set(state.nodes.map(n=>n.cc))])$('country').insertAdjacentHTML('beforeend',`<option>${cc}</option>`);refresh();openNode((filtered[0]||state.nodes[0]).key)}
function refresh(){const text=$('search').value.toLowerCase(),cc=$('country').value,st=$('status').value;filtered=state.nodes.filter(n=>(!cc||n.cc===cc)&&(!text||(n.name+' '+n.key).toLowerCase().includes(text))&&(!st||(st==='open'&&!n.decision)||(st==='confirmed'&&n.decision)||(st==='none'&&n.decision?.result==='none')));$('list').innerHTML=filtered.map(n=>`<div class="row ${n.key===current?'active':''} ${n.decision?'confirmed':''} ${n.decision?.result==='none'?'none':''}" data-key="${esc(n.key)}"><span class="key">${esc(n.key)}</span> ${esc(n.name)}<small>${esc(n.typ)}</small></div>`).join('');$('list').querySelectorAll('.row').forEach(x=>x.onclick=()=>openNode(x.dataset.key));updateProgress()}
function updateProgress(){const done=state.nodes.filter(n=>n.decision).length;$('progress').textContent=`${done} / ${state.total}`;$('bar').style.width=(100*done/state.total)+'%'}
function openNode(key){current=key;const n=state.nodes.find(x=>x.key===key);selected=n.decision?.result==='logo'?n.decision.candidate_id:null;render(n);refresh()}
function candidateHtml(n,c){const suggested=n.suggestion?.suggested_candidate_id===c.id,rejected=!!c.suggestion_rejection;return `<article class="candidate ${selected===c.id?'selected':''} ${suggested?'suggested':''} ${rejected?'rejected':''}" data-id="${esc(c.id)}" ${rejected?'aria-disabled="true"':''}><img src="/asset?path=${q(c.preview_path)}"><b>${esc(c.id)} · ${esc(c.kind)}</b><small>${esc(c.width)}×${esc(c.height)} · ${esc(c.format)}</small>${rejected?`<small class="rejection">Nicht vorschlagen: ${esc(c.suggestion_rejection)}</small>`:''}<a href="${esc(c.final_url||c.url)}" target="_blank" onclick="event.stopPropagation()">Quelle öffnen</a></article>`}
function preview(n){const base=selected?`/prepared?key=${q(n.key)}&candidate=${q(selected)}`:'';const light=base?`${base}&theme=light`:'';const dark=base?`${base}&theme=dark`:'';return `<div class="previews"><div class="theme light"><div class="node">${light?`<img src="${light}">`:''}<strong>${esc(n.tid)}</strong></div><small>Hell</small></div><div class="theme dark"><div class="node">${dark?`<img src="${dark}">`:''}<strong>${esc(n.tid)}</strong></div><small>Dunkel</small></div></div>`}
function render(n){const sourceLabel=n.domain.suggestion_rejection?'Ungeprüfter Recherchelink':'Offizielle Quelle';$('main').innerHTML=`<div class="headline"><div><h2>${esc(n.name)}</h2><div class="meta">${esc(n.key)} · ${esc(n.typ)}</div></div><div><span class="badge">${esc(n.domain.status)}</span>${n.decision?`<span class="badge">bestätigt: ${esc(n.decision.result)}</span>`:'<span class="badge">offen</span>'}</div></div><div class="suggestion"><b>Vorschlag: ${esc(n.suggestion?.suggested_result||'—')} ${esc(n.suggestion?.suggested_candidate_id||'')}</b><br>${esc(n.suggestion?.reason||'Noch kein Vorschlag')}</div><div class="source">${sourceLabel}: ${n.domain.official_url?`<a href="${esc(n.domain.official_url)}" target="_blank">${esc(n.domain.official_url)}</a>`:'keine verifizierte Domain'}</div><section class="candidates">${n.candidates.map(c=>candidateHtml(n,c)).join('')||'<p>Keine zulässigen Bildkandidaten.</p>'}</section>${preview(n)}<label>Notiz<textarea id="notes">${esc(n.decision?.notes||'')}</textarea></label><div class="actions"><button class="logo" id="confirmLogo" ${selected?'':'disabled'}>Ausgewähltes Logo bestätigen</button><button class="none" id="confirmNone">none bestätigen</button><button class="next" id="next">Nächster offener</button><span class="message" id="message"></span></div>`;$('main').querySelectorAll('.candidate:not(.rejected)').forEach(x=>x.onclick=()=>{selected=x.dataset.id;render(n)});$('confirmLogo').onclick=()=>save(n,'logo');$('confirmNone').onclick=()=>save(n,'none');$('next').onclick=nextOpen}
async function save(n,result){const body={key:n.key,result,candidate_id:result==='logo'?selected:'',notes:$('notes').value,reviewer:'user'};const res=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await res.json();if(!res.ok){$('message').textContent=data.error;$('message').className='message error';return}n.decision=data.decision;$('message').textContent=`Gespeichert · ${data.confirmed}/${data.total}`;refresh();setTimeout(nextOpen,350)}
function nextOpen(){const open=state.nodes.find(n=>!n.decision&&(! $('country').value||n.cc===$('country').value));if(open)openNode(open.key);else alert('In diesem Filter sind keine offenen Entscheidungen mehr.')}
for(const id of ['search','country','status'])$(id).addEventListener(id==='search'?'input':'change',refresh);load().catch(e=>$('main').innerHTML=`<p class="error">${esc(e)}</p>`);
</script>
</body></html>
